name: CI — Build Check

on:
  push:
    branches: [main, master, 'claude/**', 'feature/**', 'develop']
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build
