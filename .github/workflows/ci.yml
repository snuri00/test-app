name: CI — Flutter Analyze & Build Check

on:
  push:
    branches: [ main, master, 'claude/**', 'feature/**', 'develop' ]
  pull_request:
    branches: [ main, master ]

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'

jobs:
  analyze-and-build:
    name: Analyze & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate launcher icon PNGs
        run: |
          declare -A SIZES=(["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192)
          BASE="android/app/src/main/res"
          for DENSITY in "${!SIZES[@]}"; do
            SIZE="${SIZES[$DENSITY]}"; HALF=$((SIZE/2)); DIR="$BASE/$DENSITY"; mkdir -p "$DIR"
            convert -size "${SIZE}x${SIZE}" xc:"#050A0E" \
              -fill none -stroke "#00D4FF" -strokewidth $((SIZE/24+1)) \
              -draw "circle ${HALF},${HALF} ${HALF},$((HALF-SIZE*9/20))" \
              -stroke "#00FF88" -draw "line ${HALF},${HALF} $((HALF+SIZE*9/20)),$((HALF-SIZE*9/20))" \
              -fill "#00D4FF" -stroke none -draw "circle ${HALF},${HALF} $((HALF+3)),${HALF}" \
              "${DIR}/ic_launcher.png"
            cp "${DIR}/ic_launcher.png" "${DIR}/ic_launcher_round.png"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
