name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'claude/flutter-flight-radar-app-jEgQs'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ── 3. Flutter ───────────────────────────────────────────────────────
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ── 4. Version ───────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Branch push — use date-based version
            VERSION="1.0.0-dev.${{ github.run_number }}"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}+${BUILD_NUMBER}"

      # ── 5. Keystore ──────────────────────────────────────────────────────
      - name: Set up release signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using provided keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
            echo "Signed with release keystore."
          else
            echo "No KEYSTORE_BASE64 secret found — generating a debug keystore for signing..."
            keytool -genkeypair \
              -v \
              -keystore android/app/keystore.jks \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias skywatch \
              -storepass skywatchpass \
              -keypass skywatchpass \
              -dname "CN=SKYWATCH ATC, OU=Dev, O=FlightRadar, L=Istanbul, S=Istanbul, C=TR" \
              2>&1
            cat > android/key.properties <<EOF
          storePassword=skywatchpass
          keyPassword=skywatchpass
          keyAlias=skywatch
          storeFile=keystore.jks
          EOF
            echo "Signed with auto-generated keystore."
          fi

      # ── 6. Launcher icons (PNG for API < 26) ─────────────────────────────
      - name: Generate launcher icon PNGs
        run: |
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )
          BASE="android/app/src/main/res"
          for DENSITY in "${!SIZES[@]}"; do
            SIZE="${SIZES[$DENSITY]}"
            DIR="$BASE/$DENSITY"
            mkdir -p "$DIR"
            HALF=$((SIZE / 2))
            R1=$((SIZE * 9 / 20))   # outer ring
            R2=$((SIZE * 6 / 20))   # mid ring
            R3=$((SIZE * 3 / 20))   # inner ring
            SW=$((SIZE / 24 + 1))   # stroke width
            convert -size "${SIZE}x${SIZE}" xc:"#050A0E" \
              -fill none \
              -stroke "#00D4FF" -strokewidth "$SW" \
              -draw "circle ${HALF},${HALF} ${HALF},$((HALF - R1))" \
              -strokewidth "$((SW - 1))" -strokealpha 0.6 \
              -draw "circle ${HALF},${HALF} ${HALF},$((HALF - R2))" \
              -strokewidth 1 -strokealpha 0.3 \
              -draw "circle ${HALF},${HALF} ${HALF},$((HALF - R3))" \
              -strokewidth 1 -strokealpha 0.4 \
              -draw "line ${HALF},0 ${HALF},$((SIZE - 1))" \
              -draw "line 0,${HALF},$((SIZE - 1)),${HALF}" \
              -stroke "#00FF88" -strokewidth "$SW" -strokealpha 1 \
              -draw "line ${HALF},${HALF} $((HALF + R1)),$((HALF - R1))" \
              -fill "#00D4FF" -stroke none \
              -draw "circle ${HALF},${HALF} $((HALF + 3)),${HALF}" \
              -fill "#00FF88" \
              -draw "circle $((HALF + R2)),$((HALF - R2)) $((HALF + R2 + 3)),$((HALF - R2))" \
              "${DIR}/ic_launcher.png"
            cp "${DIR}/ic_launcher.png" "${DIR}/ic_launcher_round.png"
          done

      # ── 7. Dependencies ──────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 7. Analyze ───────────────────────────────────────────────────────
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ── 8. Build APK ─────────────────────────────────────────────────────
      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --dart-define=FLUTTER_APP_VERSION=${{ steps.version.outputs.version }}

      # ── 9. Build App Bundle (AAB) ─────────────────────────────────────────
      - name: Build App Bundle (AAB)
        run: |
          flutter build appbundle \
            --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}
        continue-on-error: true

      # ── 10. Rename artifacts ─────────────────────────────────────────────
      - name: Rename artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD=${{ steps.version.outputs.build_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/skywatch-atc-v${VERSION}+${BUILD}.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab \
               dist/skywatch-atc-v${VERSION}+${BUILD}.aab
          fi
          echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in dist/*; do
            SIZE=$(du -sh "$f" | cut -f1)
            echo "| $(basename $f) | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done

      # ── 11. Upload APK artifact ───────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skywatch-atc-apk-v${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30

      # ── 12. Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'SKYWATCH ATC ${{ steps.version.outputs.tag }}'
          body: |
            ## SKYWATCH ATC — Defense Grade Flight Radar

            ### Release ${{ steps.version.outputs.tag }}  •  Build #${{ steps.version.outputs.build_number }}

            **Live flight tracking** powered by OpenSky Network API.
            Dark tactical HUD interface inspired by defense industry systems.

            ---

            ### Install
            1. Download `skywatch-atc-*.apk` below
            2. Enable **Install unknown apps** on your Android device
            3. Install the APK

            ### What's included
            - Real-time flight radar with 30s auto-refresh
            - Defense-grade dark HUD (QT style)
            - Interactive map with radar sweep animation
            - Flight telemetry: altitude, speed, heading, vertical rate
            - Searchable contact list with threat assessment

            ---
            > Built with Flutter ${{ env.FLUTTER_VERSION }} on $(date -u '+%Y-%m-%d %H:%M UTC')
          files: |
            dist/*.apk
            dist/*.aab
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
